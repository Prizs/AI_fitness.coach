name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Ejecuta cada 14 minutos
  workflow_dispatch: # Permite ejecución manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://ai-fitness-coach-818a.onrender.com/health
          echo "Pinged the server to keep it awake!"
