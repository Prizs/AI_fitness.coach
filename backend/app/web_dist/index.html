<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI Fitness Coach</title>
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Google 3D Model Viewer para modelos anatomicos glTF / GLB -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    // Notificación sonora y visual (Web Audio API Chime)
    window.playNotificationChime = function() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;
        
        // Tono 1: 659.25 Hz (E5)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.25, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.18);

        // Tono 2: 987.77 Hz (B5)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(987.77, now + 0.08);
        gain2.gain.setValueAtTime(0.3, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.42);
      } catch (e) {
        console.warn('Audio chime warning:', e);
      }
    };

    window.showBrowserNotification = function(title, body) {
      try {
        if ('Notification' in window) {
          if (Notification.permission === 'granted') {
            new Notification(title, { body: body, icon: 'icons/Icon-192.png' });
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then(function(permission) {
              if (permission === 'granted') {
                new Notification(title, { body: body, icon: 'icons/Icon-192.png' });
              }
            });
          }
        }
      } catch (e) {}
    };

    // Motor de captura de voz híbrido (Web Speech + MediaRecorder con respaldo IA)
    window.AIFitnessVoice = {
      recognition: null,
      mediaRecorder: null,
      audioStream: null,
      audioChunks: [],
      isListening: false,
      transcript: '',
      onResultCb: null,
      onStatusCb: null,
      onErrorCb: null,
      apiBaseUrl: '',

      isSupported: function() {
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ||
               ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
      },

      start: async function(onResult, onStatus, onError, apiBaseUrl) {
        this.stop();
        this.transcript = '';
        this.audioChunks = [];
        this.onResultCb = onResult;
        this.onStatusCb = onStatus;
        this.onErrorCb = onError;
        this.isListening = true;
        this.apiBaseUrl = apiBaseUrl || '';

        // 1. Iniciar captura nativa con getUserMedia + MediaRecorder (compatible con Brave, Chrome, Safari, etc.)
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            let audioConstraints = {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            };
            try {
              const devices = await navigator.mediaDevices.enumerateDevices();
              const sonar = devices.find(d => d.kind === 'audioinput' && /sonar|steelseries/i.test(d.label || ''));
              if (sonar && sonar.deviceId) {
                audioConstraints = {
                  deviceId: { exact: sonar.deviceId },
                  echoCancellation: false,
                  noiseSuppression: false,
                  autoGainControl: false
                };
                console.log('AIFitnessVoice: Micrófono SteelSeries Sonar enlazado:', sonar.label);
              }
            } catch (devErr) {
              console.warn('Dispositivos aviso:', devErr);
            }
            const stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
            this.audioStream = stream;
            let mimeType = 'audio/webm;codecs=opus';
            if (typeof MediaRecorder !== 'undefined') {
              if (!MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
                else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
                else mimeType = '';
              }
              const options = mimeType ? { mimeType: mimeType } : {};
              this.mediaRecorder = new MediaRecorder(stream, options);
              this.mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                  this.audioChunks.push(e.data);
                }
              };
              this.mediaRecorder.start(100);
            }
          }
        } catch (mediaErr) {
          console.warn('getUserMedia notice:', mediaErr);
          if (mediaErr && (mediaErr.name === 'NotAllowedError' || mediaErr.name === 'PermissionDeniedError')) {
            if (this.onErrorCb) this.onErrorCb('Permiso de micrófono no otorgado en el navegador.');
            this.isListening = false;
            return false;
          }
        }

        // Señalizar escucha activa sólo cuando el grabador está listo
        if (this.onStatusCb) this.onStatusCb('listening');


        // 2. Iniciar reconocimiento en vivo (Web Speech API) si está habilitado en el navegador
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          try {
            this.recognition = new SpeechRec();
            this.recognition.continuous = true;
            this.recognition.interimResults = true;
            this.recognition.maxAlternatives = 1;
            const lang = navigator.language || 'es-419';
            this.recognition.lang = lang.startsWith('es') ? lang : 'es-419';

            this.recognition.onresult = (event) => {
              let finalStr = '';
              let interimStr = '';
              for (let i = 0; i < event.results.length; ++i) {
                const item = event.results[i];
                if (item.isFinal) finalStr += item[0].transcript;
                else interimStr += item[0].transcript;
              }
              const full = (finalStr + ' ' + interimStr).trim();
              if (full) {
                this.transcript = full;
                if (this.onResultCb) this.onResultCb(full);
              }
            };

            this.recognition.onerror = (event) => {
              // Silenciar 'network' (habitual en Brave por bloqueo a Google) y 'no-speech'
              // Ya que el MediaRecorder capturará el audio y la IA lo transcribirá sin fallar
              if (event.error === 'no-speech' || event.error === 'network') {
                console.log('SpeechRecognition notice:', event.error);
                return;
              }
              console.warn('SpeechRecognition error:', event.error);
            };

            this.recognition.onend = () => {
              if (this.isListening && this.recognition) {
                try { this.recognition.start(); } catch(e) {}
              }
            };

            this.recognition.start();
          } catch(e) {
            console.log('Web Speech init notice:', e);
          }
        }

        return true;
      },

      stop: function(onDone) {
        this.isListening = false;
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e) {}
          this.recognition = null;
        }

        const finish = (text) => {
          const res = (text || this.transcript || '').trim();
          if (this.onStatusCb) this.onStatusCb('notListening');
          if (onDone) onDone(res);
          return res;
        };

        // Si ya hay transcripción capturada en vivo por Web Speech
        if (this.transcript && this.transcript.trim().length > 0) {
          if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
            try { this.mediaRecorder.stop(); } catch(e) {}
          }
          if (this.audioStream) {
            try { this.audioStream.getTracks().forEach(t => t.stop()); } catch(e) {}
            this.audioStream = null;
          }
          return finish(this.transcript);
        }

        // Si no hay texto directo (caso Brave o red que bloquea Web Speech),
        // procesamos el audio grabado con MediaRecorder mediante el endpoint de IA backend:
        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
          this.mediaRecorder.onstop = () => {
            if (this.audioStream) {
              try { this.audioStream.getTracks().forEach(t => t.stop()); } catch(e) {}
              this.audioStream = null;
            }

            const mime = this.mediaRecorder.mimeType || 'audio/webm';
            const blob = new Blob(this.audioChunks, { type: mime });
            if (blob.size < 2500) {
              return finish('');
            }

            if (this.onResultCb) this.onResultCb('Transcribiendo nota de voz...');

            this._blobToBase64(blob).then((b64) => {
              const url = (this.apiBaseUrl || window.location.origin) + '/api/voice/transcribe';
              fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ audio_base64: b64, mime_type: mime })
              }).then(r => r.json()).then(data => {
                const aiText = (data && data.text) ? data.text.trim() : '';
                this.transcript = aiText;
                if (aiText && this.onResultCb) this.onResultCb(aiText);
                finish(aiText);
              }).catch(err => {
                console.error('Error al transcribir en backend:', err);
                finish('');
              });
            }).catch(err => {
              finish('');
            });

          };

          try {
            this.mediaRecorder.stop();
          } catch(e) {
            finish(this.transcript);
          }
          return '';
        }

        if (this.audioStream) {
          try { this.audioStream.getTracks().forEach(t => t.stop()); } catch(e) {}
          this.audioStream = null;
        }

        return finish(this.transcript);
      },

      _blobToBase64: function(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            const result = reader.result;
            const b64 = result.split(',')[1] || result;
            resolve(b64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }
    };

  </script>
  <script src="flutter_bootstrap.js?v=1.0.55" async></script>
</body>
</html>
